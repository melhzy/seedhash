[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "seedhash"
version = "0.1.0"
description = "Deterministic seed generation from string inputs using MD5 hashing"
readme = "README.md"
authors = [
    {name = "Ziyuan Huang", email = "ziyuan.huang@umassmed.edu"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]
keywords = ["seed", "random", "hash", "reproducible", "deterministic"]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
# torch.use_deterministic_algorithms(..., warn_only=True) needs torch 1.11
torch = ["torch>=1.11"]
tensorflow = ["tensorflow>=2.0.0"]
numpy = ["numpy>=1.19.0"]
pandas = ["pandas>=1.3.0"]
experiment = ["pandas>=1.3.0", "numpy>=1.19.0"]
all = [
    "torch>=1.11",
    "tensorflow>=2.0.0",
    "numpy>=1.19.0",
    "pandas>=1.3.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "flake8>=3.9",
]

[project.urls]
Homepage = "https://github.com/melhzy/seedhash"
Repository = "https://github.com/melhzy/seedhash"
Issues = "https://github.com/melhzy/seedhash/issues"

[tool.setuptools]
packages = ["seedhash"]
